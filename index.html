<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نظام تخليص الحاويات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky harbor-teal header with tabs; content in a centered column; tables and a bar chart carry the data. */
:root{
  --bg:#F2F5FF; --surface:#FFFFFF; --surface-2:#EAF0FF; --ink:#0F1B3D; --muted:#55648A; --line:#D6DFF7;
  --brand:#2563EB; --brand-soft:#DCE8FF; --on-brand:#FFFFFF;
  --head-bg:#2A2FA8; --head-bg2:#6D28D9; --head-ink:#FFFFFF; --hl:#FFC21A;
  --good:#0E9F5C; --good-soft:#D5F5E5; --warn:#B45309; --warn-soft:#FFE9BF; --bad:#E0322B; --bad-soft:#FFDAD6;
  --s-rev:#2563EB; --s-cost:#FF8A00;
  --l0:#2563EB; --l1:#F97316; --l2:#10B981; --l3:#EC4899; --l4:#8B5CF6; --l5:#06B6D4; --l6:#EF4444; --l7:#84CC16;
  --f-head:'Cairo','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Cairo',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
  direction:rtl;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1230; --surface:#151B42; --surface-2:#1D2558; --ink:#EEF1FF; --muted:#9FAEDB; --line:#2B3680;
    --brand:#6EA0FF; --brand-soft:#1F2F6E; --on-brand:#071340;
    --head-bg:#1B2080; --head-bg2:#5B21B6; --head-ink:#FFFFFF;
    --good:#3DDC97; --good-soft:#0F3B2A; --warn:#FFB84D; --warn-soft:#4A3510; --bad:#FF7A70; --bad-soft:#4D1B1A;
    --s-rev:#6EA0FF; --s-cost:#FFA133;
    --l0:#6EA0FF; --l1:#FF9A4D; --l2:#3DDC97; --l3:#FF7EC0; --l4:#B79BFF; --l5:#4DD8F0; --l6:#FF7A70; --l7:#A8E04A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1230; --surface:#151B42; --surface-2:#1D2558; --ink:#EEF1FF; --muted:#9FAEDB; --line:#2B3680;
  --brand:#6EA0FF; --brand-soft:#1F2F6E; --on-brand:#071340;
  --head-bg:#1B2080; --head-bg2:#5B21B6; --head-ink:#FFFFFF;
  --good:#3DDC97; --good-soft:#0F3B2A; --warn:#FFB84D; --warn-soft:#4A3510; --bad:#FF7A70; --bad-soft:#4D1B1A;
  --s-rev:#6EA0FF; --s-cost:#FFA133;
  --l0:#6EA0FF; --l1:#FF9A4D; --l2:#3DDC97; --l3:#FF7EC0; --l4:#B79BFF; --l5:#4DD8F0; --l6:#FF7A70; --l7:#A8E04A; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0;direction:rtl;padding:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head-bg);z-index:60}
h1,h2,h3{font-family:var(--f-head);margin:0;line-height:1.3;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--head-bg);background-image:linear-gradient(90deg,var(--head-bg),var(--head-bg2));color:var(--head-ink)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{flex:none;width:38px;height:26px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--hl) 0 3px,transparent 3px 6px),var(--hl);opacity:.95;position:relative;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.mark::after{content:"";position:absolute;inset:3px 0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 2px,transparent 2px 6px)}
.co{font-family:var(--f-head);font-weight:800;font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.sub{font-size:12px;opacity:.75}
.sync{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.12);white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-top:2px}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:inherit;opacity:.72;padding:8px 14px;cursor:pointer;font-family:var(--f-head);font-weight:600;font-size:15px;white-space:nowrap}
.tab:hover{opacity:1}
.tab[aria-selected="true"]{opacity:1;border-bottom-color:var(--hl)}

main{padding-top:20px;padding-bottom:max(40px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grow{flex:1 1 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px 0}
.panel-h h2{font-size:17px}
.panel-b{padding:14px 16px 16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;display:inline-block}
.pos{color:var(--good)} .neg{color:var(--bad)}
.mono{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate;display:inline-block;letter-spacing:.02em}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger[data-armed]{background:var(--bad);color:var(--surface)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.icon-btn{width:36px;height:36px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1}
.in{width:100%;min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
textarea.in{min-height:72px;resize:vertical}
.in.ltr{direction:ltr;text-align:right}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.grid.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.toolbar{display:grid;grid-template-columns:minmax(0,2fr) repeat(2,minmax(0,1fr)) auto;gap:10px;padding:14px 16px;align-items:end}
@media(max-width:760px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--f-head);font-weight:800;font-size:27px;line-height:1.25;overflow-wrap:anywhere}
.kpi .v .cur{font-size:14px;font-weight:600;color:var(--muted)}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.main{background:var(--brand-soft);border-color:transparent}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:880px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.02em}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr[data-act]{cursor:pointer}
tbody tr[data-act]:hover{background:var(--brand-soft)}
tbody tr:nth-child(even){background:var(--surface-2)}
tbody tr[style] td:first-child{box-shadow:inset -5px 0 0 var(--lc)}
.cid{display:flex;align-items:center;gap:10px}
.cico{flex:none;width:34px;height:22px;border-radius:3px;background:var(--lc,var(--l7));position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.cico::after{content:"";position:absolute;inset:3px 0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,transparent 2px 5px)}
.cid b{font-weight:600}
tfoot td{font-weight:700;background:var(--surface-2);border-bottom:0}
td.n,th.n{text-align:left}
.cell-sub{font-size:12px;color:var(--muted)}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.mute{background:var(--surface-2);color:var(--muted)}
.demo-tag{font-size:11px;margin-inline-start:6px;padding:0 6px;border-radius:4px;background:var(--surface-2);color:var(--muted);border:1px dashed var(--line);font-weight:500}

/* dashboard */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.watch{list-style:none;margin:0;padding:0}
.watch li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.watch li:last-child{border-bottom:0}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px}
.chart-box{overflow-x:auto}
.chart-box svg{display:block;min-width:660px;width:100%;height:auto}
.chart-box text{font-family:var(--f-body);font-size:12px;fill:var(--muted)}
.empty{padding:36px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h2{font-size:19px}
.empty p{margin:0;max-width:46ch;color:var(--muted)}

/* modal */
.overlay{position:fixed;inset:0;z-index:70;background:rgba(5,15,20,.55);overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));padding-top:max(16px,env(safe-area-inset-top,0px))}
.modal{background:var(--surface);color:var(--ink);border-radius:12px;max-width:880px;margin:0 auto;border:1px solid var(--line)}
.modal.sm{max-width:520px}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.m-head h2{font-size:18px}
.m-body{padding:6px 18px 16px;display:flex;flex-direction:column;gap:18px}
.fs{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.fs>h3{font-size:14px;color:var(--brand);letter-spacing:.02em}
.live{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:14px}
.m-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 12px 12px;padding:12px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sum{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.sum b{font-family:var(--f-head);font-size:16px}
.err{color:var(--bad);font-size:13.5px;min-height:1em}
.toast{position:fixed;z-index:90;inset-inline:0;bottom:max(20px,env(safe-area-inset-bottom,0px));margin:0 auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}}}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="wrap top-in">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div><div class="co" id="co">شركة النقل والتخليص</div><div class="sub">إدارة الحاويات والتخليص الكمركي</div></div>
      </div>
      <div class="row" style="gap:8px;flex-wrap:nowrap"><span class="sync" id="sync">جارٍ التحميل…</span><button class="btn sm" data-act="logout" id="logout" hidden style="min-height:28px">خروج</button></div>
    </div>
    <nav class="wrap tabs" id="tabs" role="tablist" aria-label="الأقسام">
      <button class="tab" role="tab" data-act="tab" data-id="dash">الرئيسية</button>
      <button class="tab" role="tab" data-act="tab" data-id="cont">الحاويات</button>
      <button class="tab" role="tab" data-act="tab" data-id="merch">التجار</button>
      <button class="tab" role="tab" data-act="tab" data-id="set">الإعدادات</button>
    </nav>
  </header>
  <main class="wrap" id="main"></main>
</div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
'use strict';
window.addEventListener('error',function(ev){lastErr=(ev.message||'خطأ')+(ev.lineno?' (سطر '+ev.lineno+')':'');try{render()}catch(x){}});
window.addEventListener('unhandledrejection',function(ev){var r=ev.reason;lastErr=(r&&(r.message||r.code))||String(r);try{render()}catch(x){}});
document.documentElement.lang='ar';document.documentElement.dir='rtl';

/* ---------- constants ---------- */
var COST_KEYS=['do','sea','loc','rel','ret','cus','door','ports','match','track','t','cusx'];
var DEF_LABELS={do:'DO',sea:'نقل مائي',loc:'لوكيشن',rel:'إطلاق',ret:'عوائد',cus:'كمرك',door:'باب ورصيف',ports:'منافذ',match:'مطابقة',track:'تتبع',t:'ت',cusx:'مصاريف كمرك'};
var SIZES=['20','40','40HC'];
var SIZE_LABEL={'20':"20'",'40':"40'",'40HC':"40' HC"};
var LINES=['MSC','Maersk','CMA CGM','Hapag-Lloyd','COSCO','ONE','Evergreen','HMM','ZIM','Yang Ming'];
var BERTHS=['ميناء أم قصر الشمالي','ميناء أم قصر الجنوبي','ميناء خور الزبير','ميناء أبو فلوس'];
var MONTHS=['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
var DAY=86400000;
var DEF_SETTINGS={company:'شركة النقل والتخليص',currency:'د.ع',freeDays:{'20':7,'40':7,'40HC':7},rate:{'20':35000,'40':60000,'40HC':65000},labels:DEF_LABELS};

/* ---------- state ---------- */
var state={merchants:[],containers:[],saved:{}};
var ui={tab:'dash',month:'all',q:'',fm:'',fs:'all',year:new Date().getFullYear()};
var loaded={m:false,c:false,s:false};
var step='بدء التشغيل',lastErr='',sb=null,mode='loading',slow=false,fault=false,hasDl=true;

/* ---------- helpers ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function n(v){var x=parseFloat(v);return isFinite(x)?x:0}
function has(v){return v!==''&&v!=null&&isFinite(parseFloat(v))}
function fmt(x,d){x=Number(x)||0;return x.toLocaleString('en-US',{maximumFractionDigits:d==null?0:d})}
function pad(x){return (x<10?'0':'')+x}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function ymd(s){if(!s)return null;var p=String(s).split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2])}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dshow(s){if(!s)return '—';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function S(){
  var s=state.saved||{},d=DEF_SETTINGS;
  return {
    company:s.company||d.company,currency:s.currency||d.currency,
    freeDays:Object.assign({},d.freeDays,s.freeDays||{}),
    rate:Object.assign({},d.rate,s.rate||{}),
    labels:Object.assign({},d.labels,s.labels||{})
  };
}
function cur(){return esc(S().currency)}
function money(x){
  x=Number(x)||0;
  return '<span class="num">'+fmt(x,0)+'</span> <span class="cur">'+cur()+'</span>';
}
function mfmt(x){return fmt(x,0)}
function lineVar(l){var h=0,t=String(l||'').trim().toLowerCase();if(!t)return 'var(--l7)';for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))%997;return 'var(--l'+(h%8)+')'}
function cico(c){return '<span class="cico" style="--lc:'+lineVar(c.line)+'"></span>'}
function moneyC(x){return '<span class="'+(x>0?'pos':x<0?'neg':'')+'">'+money(x)+'</span>'}
function calDate(c){return c.pickup||c.arrival||''}
function mName(id){var m=state.merchants.find(function(x){return x.id===id});return m?m.name:'—'}

/* ---------- calculation ---------- */
function calc(c){
  var s=S(),arr=ymd(c.arrival),pk=ymd(c.pickup);
  var end=pk!=null?pk:ymd(todayStr());
  var days=arr==null?0:Math.max(0,Math.round((end-arr)/DAY));
  var free=has(c.freeOv)?n(c.freeOv):n(s.freeDays[c.size]);
  var rate=has(c.rateOv)?n(c.rateOv):n(s.rate[c.size]);
  var delayDays=Math.max(0,days-free);
  var delayCost=delayDays*rate;
  var items=0;COST_KEYS.forEach(function(k){items+=n(c.costs&&c.costs[k])});
  var cost=items+delayCost,rev=n(c.revenue);
  return {days:days,free:free,rate:rate,left:free-days,delayDays:delayDays,delayCost:delayCost,items:items,cost:cost,rev:rev,profit:rev-cost,open:pk==null}
}
function agg(list){
  var a={count:0,open:0,rev:0,cost:0,profit:0,delay:0,items:0};
  list.forEach(function(c){var k=calc(c);a.count++;if(k.open)a.open++;a.rev+=k.rev;a.cost+=k.cost;a.profit+=k.profit;a.delay+=k.delayCost;a.items+=k.items});
  return a;
}

/* ---------- storage ---------- */
function loadLocal(){
  try{
    var r=JSON.parse(localStorage.getItem('lg_container_v1')||'null');
    if(r){state.merchants=r.merchants||[];state.containers=r.containers||[];state.saved=r.saved||{}}
  }catch(e){}
  loaded={m:true,c:true,s:true};
}
function persistLocal(){try{localStorage.setItem('lg_container_v1',JSON.stringify(state))}catch(e){}}
function clean(o){return JSON.parse(JSON.stringify(o))}
function put(kind,obj){
  var id=obj.id,body=clean(obj);delete body.id;
  if(mode==='cloud')return sbPut(kind,id,body);
  var arr=state[kind],i=arr.findIndex(function(x){return x.id===id});
  var rec=Object.assign({id:id},body);
  if(i>=0)arr[i]=rec;else arr.push(rec);
  persistLocal();render();return Promise.resolve();
}
function del(kind,id){
  if(mode==='cloud')return sbDel(kind,id);
  state[kind]=state[kind].filter(function(x){return x.id!==id});
  persistLocal();render();return Promise.resolve();
}
function putSettings(obj){
  if(mode==='cloud')return sbSettings(clean(obj));
  state.saved=clean(obj);persistLocal();render();return Promise.resolve();
}
function fail(e){
  var m=e&&(e.code==='invalid_argument'||e.code==='42501')?'لا تملك صلاحية التعديل على هذه البيانات.':e&&e.code==='quota_exceeded'?'امتلأت سعة التخزين.':'تعذّر الحفظ. حاول مرة أخرى.';
  toast(m);
}
function fetchPage(off,acc){
  return sb.from('records').select('kind,id,body').order('kind').order('id').range(off,off+999).then(function(r){
    if(r.error)throw r.error;
    acc=acc.concat(r.data);
    return r.data.length===1000?fetchPage(off+1000,acc):acc;
  });
}
function loadAll(){
  return fetchPage(0,[]).then(function(rows){
    var m=[],c=[],cfg={};
    rows.forEach(function(x){
      if(x.kind==='merchants')m.push(Object.assign({id:x.id},x.body));
      else if(x.kind==='containers')c.push(Object.assign({id:x.id},x.body));
      else if(x.kind==='config'&&x.id==='main')cfg=x.body||{};
    });
    state.merchants=m;state.containers=c;state.saved=cfg;loaded={m:true,c:true,s:true};fault=false;render();
  }).catch(function(e){fault=true;lastErr=(e&&(e.message||e.code))||String(e);render()});
}
function applyLocal(kind,id,body){
  var arr=state[kind],i=arr.findIndex(function(x){return x.id===id}),rec=Object.assign({id:id},body);
  if(i>=0)arr[i]=rec;else arr.push(rec);render();
}
function sbPut(kind,id,body){
  return sb.from('records').upsert({kind:kind,id:id,body:body,updated_at:new Date().toISOString()}).then(function(r){
    if(r.error)throw r.error;applyLocal(kind,id,body);
  });
}
function sbDel(kind,id){
  return sb.from('records').delete().eq('kind',kind).eq('id',id).then(function(r){
    if(r.error)throw r.error;
    state[kind]=state[kind].filter(function(x){return x.id!==id});render();
  });
}
function sbSettings(obj){
  return sb.from('records').upsert({kind:'config',id:'main',body:obj,updated_at:new Date().toISOString()}).then(function(r){
    if(r.error)throw r.error;state.saved=obj;render();
  });
}

/* ---------- views ---------- */
function monthLabel(ym){var p=ym.split('-');return MONTHS[+p[1]-1]+' '+p[0]}
function emptyDash(){
  return '<div class="panel"><div class="empty"><h2>ابدأ بإضافة أول حاوية</h2><p>أضف التاجر ثم الحاوية مع الخط والرصيف وتاريخ الرسو والاستلام والمصاريف. يحسب النظام التأخير والكلفة والبيع والربح تلقائياً.</p><div class="row" style="justify-content:center"><button class="btn primary" data-act="add-container">إضافة حاوية</button><button class="btn" data-act="load-demo">تحميل بيانات تجريبية</button></div></div></div>';
}
function viewDash(){
  if(!state.containers.length)return emptyDash();
  var months={};state.containers.forEach(function(c){months[calDate(c)?calDate(c).slice(0,7):'none']=1});
  var keys=Object.keys(months).sort().reverse();
  var list=state.containers.filter(function(c){return ui.month==='all'||(calDate(c)?calDate(c).slice(0,7):'none')===ui.month});
  var a=agg(list),mg=a.rev>0?a.profit/a.rev*100:0;
  var h='<div class="row between"><h1 style="font-size:22px">نظرة عامة</h1><label class="f" style="min-width:210px">الفترة (شهر التقويم)<select class="in" data-f="month" id="f-month"><option value="all">كل الفترات</option>'+
    keys.map(function(k){return '<option value="'+k+'"'+(ui.month===k?' selected':'')+'>'+(k==='none'?'بدون تاريخ':monthLabel(k))+'</option>'}).join('')+'</select></label></div>';
  h+='<div class="kpis">'+
    '<div class="kpi main"><span class="l">صافي الربح</span><span class="v '+(a.profit>=0?'pos':'neg')+'">'+money(a.profit)+'</span><span class="s">هامش الربح <span class="num">'+fmt(mg,1)+'%</span></span></div>'+
    '<div class="kpi"><span class="l">البيع</span><span class="v">'+money(a.rev)+'</span><span class="s">المستحق على التجار</span></div>'+
    '<div class="kpi"><span class="l">الكلفة</span><span class="v">'+money(a.cost)+'</span><span class="s">منها غرامات تأخير '+money(a.delay)+'</span></div>'+
    '<div class="kpi"><span class="l">عدد الحاويات</span><span class="v"><span class="num">'+a.count+'</span></span><span class="s">لم تُستلم بعد: <span class="num">'+a.open+'</span></span></div>'+
  '</div>';
  h+='<div class="panel"><div class="panel-h"><h2>البيع مقابل الكلفة حسب أشهر السنة</h2><div class="row"><label class="f" style="flex-direction:row;align-items:center;gap:8px">السنة<select class="in" style="width:auto;min-height:34px" data-f="year" id="f-year">'+yearOpts()+'</select></label><div class="legend"><span><i style="background:var(--s-rev)"></i>البيع</span><span><i style="background:var(--s-cost)"></i>الكلفة</span></div></div></div><div class="panel-b chart-box">'+chart()+'</div></div>';
  h+='<div class="two">'+watchPanel(list)+topMerchants(list)+'</div>';
  return h;
}
function niceTop(max){
  var p=Math.pow(10,Math.floor(Math.log10(max))),f=max/p,nf=f<=1?1:f<=2?2:f<=5?5:10;return nf*p;
}
function yearOpts(){
  var ys={};ys[new Date().getFullYear()]=1;
  state.containers.forEach(function(c){var d=calDate(c);if(d)ys[d.slice(0,4)]=1});
  return Object.keys(ys).sort().reverse().map(function(y){return '<option value="'+y+'"'+(String(ui.year)===y?' selected':'')+'>'+y+'</option>'}).join('');
}
function chart(){
  var yr=String(ui.year),by=[];
  for(var m=0;m<12;m++)by.push({rev:0,cost:0});
  var cnt=0;
  state.containers.forEach(function(c){
    var d=calDate(c);if(!d||d.slice(0,4)!==yr)return;
    var r=calc(c),m=+d.slice(5,7)-1;by[m].rev+=r.rev;by[m].cost+=r.cost;cnt++;
  });
  var W=760,H=270,pl=10,pr=84,pt=14,pb=46,iw=W-pl-pr,ih=H-pt-pb;
  var mx=0;by.forEach(function(d){mx=Math.max(mx,d.rev,d.cost)});
  var top=niceTop(mx||1),step=iw/12,bw=Math.min(18,step*.3);
  var s=(cnt?'':'<p class="muted small" style="margin:0 0 8px">لا توجد حاويات في سنة '+yr+'.</p>')+'<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="البيع والكلفة حسب أشهر السنة">';
  for(var i=0;i<=5;i++){
    var v=top/5*i,y=pt+ih-ih*(v/top);
    s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>';
    s+='<text x="'+(W-pr+8)+'" y="'+(y+4)+'">'+(cnt?fmt(v,0):'')+'</text>';
  }
  by.forEach(function(d,i){
    var cx=W-pr-step*(i+.5),hr=ih*(d.rev/top),hc=ih*(d.cost/top),nm=MONTHS[i].split(' ');
    if(d.rev>0)s+='<rect x="'+(cx-bw-1)+'" y="'+(pt+ih-hr)+'" width="'+bw+'" height="'+hr+'" rx="2" fill="var(--s-rev)"><title>'+MONTHS[i]+' '+yr+' — البيع: '+fmt(d.rev,0)+'</title></rect>';
    if(d.cost>0)s+='<rect x="'+(cx+1)+'" y="'+(pt+ih-hc)+'" width="'+bw+'" height="'+hc+'" rx="2" fill="var(--s-cost)"><title>'+MONTHS[i]+' '+yr+' — الكلفة: '+fmt(d.cost,0)+'</title></rect>';
    s+='<text x="'+cx+'" y="'+(H-26)+'" text-anchor="middle"><tspan x="'+cx+'" dy="0">'+nm[0]+'</tspan>'+(nm[1]?'<tspan x="'+cx+'" dy="13">'+nm.slice(1).join(' ')+'</tspan>':'')+'</text>';
  });
  return s+'</svg>';
}
function watchPanel(list){
  var rows=list.map(function(c){return {c:c,k:calc(c)}}).filter(function(x){return x.k.open}).sort(function(a,b){return a.k.left-b.k.left}).slice(0,8);
  var h='<div class="panel"><div class="panel-h"><h2>حاويات تحتاج متابعة</h2></div><div class="panel-b">';
  if(!rows.length)return h+'<p class="muted" style="margin:0">لا توجد حاويات بانتظار الاستلام.</p></div></div>';
  h+='<ul class="watch">'+rows.map(function(x){
    var late=x.k.delayDays>0;
    return '<li><div class="cid">'+cico(x.c)+'<div><span class="mono"><b>'+esc(x.c.number)+'</b></span><div class="cell-sub">'+esc(mName(x.c.merchantId))+' · '+esc(x.c.line||'')+'</div></div></div><div style="text-align:left">'+
      (late?'<span class="chip bad">متأخرة '+x.k.delayDays+' يوم</span><div class="cell-sub">غرامة '+money(x.k.delayCost)+'</div>':

}
function topMerchants(list){

}

function filtered(){

  h+='<div class="panel"><div class="panel-h"><h2>بيانات تجريبية</h2></div><div class="panel-b"><p class="muted small" style="margin:0 0 12px">حمّل تجّاراً وحاويات تجريبية لتجربة النظام، ثم احذفها بضغطة واحدة. لا تمس بياناتك الحقيقية.</p><div class="row"><button class="btn" data-act="load-demo">تحميل بيانات تجريبية</button><button class="btn danger" data-act="remove-demo">حذف البيانات التجريبية</button></div></div></div>';
  return h;
}

/* ---------- modals ---------- */
function closeModal(){$('#modal-root').innerHTML=''}
function costInput(k,v){return '<label class="f">'+esc(S().labels[k])+'<input class="in ltr" id="c-'+k+'" type="number" inputmode="decimal" min="0" step="any" value="'+(v?esc(v):'')+'" placeholder="0"></label>'}
function openContainer(id){
  var c=id?state.containers.find(function(x){return x.id===id}):null;
  var isNew=!c;c=c||{costs:{},size:'40',arrival:'',pickup:''};
  var ms=state.merchants.slice().sort(function(a,b){return a.name.localeCompare(b.name,'ar')});
  var dl='<datalist id="dl-line">'+LINES.map(function(x){return '<option value="'+x+'">'}).join('')+'</datalist><datalist id="dl-berth">'+BERTHS.map(function(x){return '<option value="'+x+'">'}).join('')+'</datalist>';
  var h='<div class="overlay" data-act="ovl"><div class="modal" role="dialog" aria-modal="true" aria-label="بيانات الحاوية">'+
  '<div class="m-head"><h2>'+(isNew?'حاوية جديدة':'تعديل الحاوية')+'</h2><button class="icon-btn" data-act="close" aria-label="إغلاق">×</button></div>'+
  '<form id="cf" data-id="'+esc(c.id||'')+'" autocomplete="off"><div class="m-body">'+
  '<div class="fs"><h3>بيانات الحاوية</h3><div class="grid">'+
    '<label class="f">التاجر<select class="in" id="cf-merchant"><option value="">— اختر التاجر —</option>'+ms.map(function(m){return '<option value="'+esc(m.id)+'"'+(c.merchantId===m.id?' selected':'')+'>'+esc(m.name)+'</option>'}).join('')+'</select></label>'+
    '<label class="f">أو اسم تاجر جديد<input class="in" id="cf-newm" placeholder="يُضاف تلقائياً عند الحفظ"></label>'+
    '<label class="f">رقم الحاوية<input class="in ltr mono" id="cf-number" value="'+esc(c.number||'')+'" placeholder="MSCU1234567" style="text-transform:uppercase"></label>'+
    '<label class="f">الحجم<select class="in" id="cf-size">'+SIZES.map(function(z){return '<option value="'+z+'"'+(c.size===z?' selected':'')+'>'+SIZE_LABEL[z]+'</option>'}).join('')+'</select></label>'+
    '<label class="f">الخط الملاحي<input class="in" id="cf-line" list="dl-line" value="'+esc(c.line||'')+'"></label>'+
    '<label class="f">الرصيف<input class="in" id="cf-berth" list="dl-berth" value="'+esc(c.berth||'')+'"></label>'+
    '<label class="f">تاريخ الرسو<input class="in ltr" id="cf-arrival" type="date" value="'+esc(c.arrival||'')+'"></label>'+
    '<label class="f">تاريخ الاستلام<input class="in ltr" id="cf-pickup" type="date" value="'+esc(c.pickup||'')+'"></label>'+
  '</div>'+dl+'</div>'+
  '<div class="fs"><h3>التأخير</h3><div class="grid"><label class="f">أيام السماح (اتركه فارغاً للافتراضي)<input class="in ltr" id="cf-free" type="number" min="0" step="1" value="'+(has(c.freeOv)?esc(c.freeOv):'')+'"></label><label class="f">الغرامة اليومية (اتركه فارغاً للافتراضي)<input class="in ltr" id="cf-rate" type="number" min="0" step="any" value="'+(has(c.rateOv)?esc(c.rateOv):'')+'"></label></div><div class="live" id="cf-delay"></div></div>'+
  '<div class="fs"><h3>المصاريف</h3><div class="grid">'+COST_KEYS.map(function(k){return costInput(k,c.costs&&c.costs[k])}).join('')+'</div></div>'+
  '<div class="fs"><h3>البيع</h3><div class="grid"><label class="f">المبلغ المستحق على التاجر<input class="in ltr" id="cf-rev" type="number" inputmode="decimal" min="0" step="any" value="'+(c.revenue?esc(c.revenue):'')+'" placeholder="0"></label>'+
    '<label class="f">اقتراح البيع بنسبة ربح %<div class="row" style="flex-wrap:nowrap"><input class="in ltr" id="cf-margin" type="number" min="0" step="any" placeholder="15"><button type="button" class="btn" data-act="apply-margin">احسب</button></div></label></div></div>'+
  '<label class="f">ملاحظات<textarea class="in" id="cf-notes">'+esc(c.notes||'')+'</textarea></label>'+
  '<div class="err" id="cf-err" role="alert"></div></div>'+
  '<div class="m-foot"><div class="sum" id="cf-sum"></div><div class="row">'+(isNew?'':'<button type="button" class="btn danger" data-act="del-container" data-id="'+esc(c.id)+'">حذف</button>')+'<button type="button" class="btn" data-act="close">إلغاء</button><button class="btn primary" type="submit">حفظ</button></div></div>'+
  '</form></div></div>';
  $('#modal-root').innerHTML=h;

}
function readForm(){
  var g=function(i){return document.getElementById(i)},costs={};
  COST_KEYS.forEach(function(k){costs[k]=n(g('c-'+k).value)});
  return {merchantId:g('cf-merchant').value,number:g('cf-number').value.trim().toUpperCase(),size:g('cf-size').value,line:g('cf-line').value.trim(),berth:g('cf-berth').value.trim(),
    arrival:g('cf-arrival').value,pickup:g('cf-pickup').value,freeOv:has(g('cf-free').value)?n(g('cf-free').value):null,rateOv:has(g('cf-rate').value)?n(g('cf-rate').value):null,
    costs:costs,revenue:n(g('cf-rev').value),notes:g('cf-notes').value.trim()};
}
function live(){
  if(!$('#cf'))return;
  var c=readForm(),k=calc(c),d=$('#cf-delay');
  d.innerHTML=c.arrival?('المدة من الرسو '+(c.pickup?'حتى الاستلام':'حتى اليوم')+': <b class="num">'+k.days+'</b> يوم · أيام السماح: <b class="num">'+fmt(k.free,0)+'</b> · أيام التأخير: <b class="num">'+k.delayDays+'</b> × <span class="num">'+fmt(k.rate)+'</span> = <b>'+money(k.delayCost)+'</b>'):'أدخل تاريخ الرسو لحساب التأخير.';
  $('#cf-sum').innerHTML='<span>الكلفة <b>'+money(k.cost)+'</b></span><span>البيع <b>'+money(k.rev)+'</b></span><span>الربح <b class="'+(k.profit>=0?'pos':'neg')+'">'+money(k.profit)+'</b></span>';
}
function saveContainer(){
  var f=readForm(),err=$('#cf-err'),id=$('#cf').dataset.id,newm=$('#cf-newm').value.trim();
  if(!f.merchantId&&!newm){err.textContent='اختر التاجر أو اكتب اسم تاجر جديد.';return}
  if(!f.number){err.textContent='أدخل رقم الحاوية.';return}
  if(f.arrival&&f.pickup&&f.pickup<f.arrival){err.textContent='تاريخ الاستلام يجب أن يكون بعد تاريخ الرسو.';return}
  err.textContent='';
  var old=id?state.containers.find(function(x){return x.id===id}):null,p=Promise.resolve(),mid=f.merchantId;
  if(!mid){
    var ex=state.merchants.find(function(m){return m.name===newm});
    if(ex)mid=ex.id;else{mid=uid();p=put('merchants',{id:mid,name:newm,phone:'',notes:''})}
  }
  var rec=Object.assign({},old||{},f,{id:id||uid(),merchantId:mid});
  p.then(function(){return put('containers',rec)}).then(function(){closeModal();toast('تم حفظ الحاوية')}).catch(fail);
}
function openMerchant(id){
  var m=id?state.merchants.find(function(x){return x.id===id}):null,isNew=!m;m=m||{};
  $('#modal-root').innerHTML='<div class="overlay" data-act="ovl"><div class="modal sm" role="dialog" aria-modal="true" aria-label="بيانات التاجر"><div class="m-head"><h2>'+(isNew?'تاجر جديد':'تعديل التاجر')+'</h2><button class="icon-btn" data-act="close" aria-label="إغلاق">×</button></div>'+
  '<form id="mf" data-id="'+esc(m.id||'')+'" autocomplete="off"><div class="m-body"><div class="fs">'+
  '<label class="f">اسم التاجر أو الشركة<input class="in" id="mf-name" value="'+esc(m.name||'')+'"></label>'+
  '<label class="f">رقم الهاتف<input class="in ltr" id="mf-phone" value="'+esc(m.phone||'')+'"></label>'+
  '<label class="f">ملاحظات<textarea class="in" id="mf-notes">'+esc(m.notes||'')+'</textarea></label>'+
  '<div class="err" id="mf-err" role="alert"></div></div></div>'+
  '<div class="m-foot"><span></span><div class="row">'+(isNew?'':'<button type="button" class="btn danger" data-act="del-merchant" data-id="'+esc(m.id)+'">حذف</button>')+'<button type="button" class="btn" data-act="close">إلغاء</button><button class="btn primary" type="submit">حفظ</button></div></div></form></div></div>';
  setTimeout(function(){var i=$('#mf-name');if(i)i.focus()},30);
}
function saveMerchant(){
  var id=$('#mf').dataset.id,name=$('#mf-name').value.trim();
  if(!name){$('#mf-err').textContent='أدخل اسم التاجر.';return}
  var old=id?state.merchants.find(function(x){return x.id===id}):null;
  var rec=Object.assign({},old||{},{id:id||uid(),name:name,phone:$('#mf-phone').value.trim(),notes:$('#mf-notes').value.trim()});
  put('merchants',rec).then(function(){closeModal();toast('تم حفظ التاجر')}).catch(fail);
}

function loadDemo(){

/* ---------- export ---------- */
function exportCsv(){
  var list=filtered(),s=S();
  var head=['التاجر','رقم الحاوية','الحجم','الخط','الرصيف','تاريخ الرسو','تاريخ الاستلام','أيام البقاء','أيام التأخير','غرامة التأخير'].concat(COST_KEYS.map(function(k){return s.labels[k]}),['إجمالي الكلفة','البيع','الربح']);
  var q=function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var rows=[head].concat(list.map(function(c){var k=calc(c);return [mName(c.merchantId),c.number,SIZE_LABEL[c.size]||c.size,c.line,c.berth,c.arrival,c.pickup,k.days,k.delayDays,k.delayCost].concat(COST_KEYS.map(function(x){return n(c.costs&&c.costs[x])}),[k.cost,k.rev,k.profit])}));
  var csv='﻿'+rows.map(function(r){return r.map(q).join(',')}).join('\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='containers-'+todayStr()+'.csv';
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
  toast('تم تجهيز الملف');
}

/* ---------- actions ---------- */
var armT;
var ACT={
  tab:function(el){ui.tab=el.dataset.id;render();window.scrollTo(0,0)},
  'add-container':function(){openContainer(null)},
  'edit-container':function(el){openContainer(el.dataset.id)},
  'add-merchant':function(){openMerchant(null)},
  'edit-merchant':function(el){openMerchant(el.dataset.id)},
  statement:function(el){ui.fm=el.dataset.id;ui.q='';ui.fs='all';ui.tab='cont';render();window.scrollTo(0,0)},
  close:closeModal,
  ovl:closeModal,
  'clear-filters':function(){ui.q='';ui.fm='';ui.fs='all';render()},
  'apply-margin':function(){
    var m=n($('#cf-margin').value),k=calc(readForm());
    $('#cf-rev').value=Math.round(k.cost*(1+m/100));live();
  },
  'del-container':function(el){confirmDel(el,function(){del('containers',el.dataset.id).then(function(){closeModal();toast('تم حذف الحاوية')}).catch(fail)})},
  'del-merchant':function(el){
    if(state.containers.some(function(c){return c.merchantId===el.dataset.id})){$('#mf-err').textContent='لا يمكن حذف تاجر لديه حاويات. احذف حاوياته أو انقلها أولاً.';return}
    confirmDel(el,function(){del('merchants',el.dataset.id).then(function(){closeModal();toast('تم حذف التاجر')}).catch(fail)});
  },
  'save-settings':function(){
    var g=function(i){return document.getElementById(i).value},o={company:g('s-company').trim(),currency:g('s-cur').trim()||'د.ع',freeDays:{},rate:{},labels:{}};
    SIZES.forEach(function(z){o.freeDays[z]=n(g('s-free-'+z));o.rate[z]=n(g('s-rate-'+z))});
    COST_KEYS.forEach(function(k){o.labels[k]=g('s-lab-'+k).trim()||DEF_LABELS[k]});
    putSettings(o).then(function(){toast('تم حفظ الإعدادات')}).catch(fail);
  },
  'load-demo':loadDemo,
  'remove-demo':removeDemo,
  'export':exportCsv,
  retry:function(){lastErr='';render();loadAll()},
  logout:function(){if(sb)sb.auth.signOut().then(function(){location.reload()})}
};
function confirmDel(el,fn){
  if(el.hasAttribute('data-armed')){fn();return}
  el.setAttribute('data-armed','1');el.textContent='اضغط مرة أخرى للتأكيد';
  clearTimeout(armT);armT=setTimeout(function(){el.removeAttribute('data-armed');el.textContent='حذف'},4000);
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='ovl'&&e.target!==el)return;
  var f=ACT[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&$('#modal-root').firstChild&&!$('#lf'))closeModal();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr[data-act]')){e.preventDefault();ACT[e.target.dataset.act](e.target)}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.f&&t.id==='f-q'){ui.q=t.value;listCont()}
  else if(t.closest&&t.closest('#cf'))live();
});
document.addEventListener('change',function(e){
  var t=e.target;if(!t.dataset||!t.dataset.f)return;
  if(t.dataset.f==='month'){ui.month=t.value;render()}
  if(t.dataset.f==='year'){ui.year=+t.value;render()}
  if(t.dataset.f==='fm'){ui.fm=t.value;listCont()}
  if(t.dataset.f==='fs'){ui.fs=t.value;listCont()}
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='cf')saveContainer();
  if(e.target.id==='mf')saveMerchant();
  if(e.target.id==='lf'){
    var em=$('#lf-email').value.trim(),pw=$('#lf-pass').value;
    $('#lf-err').textContent='';
    sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){
      if(r.error){$('#lf-err').textContent='البريد الإلكتروني أو كلمة المرور غير صحيحة.';return}
      closeModal();startCloud();
    });
  }
});

/* ---------- boot ---------- */
async function boot(){
  render();
  var cfg=window.APP_CONFIG||{};
  step='قراءة الإعدادات';render();
  if(!cfg.SUPABASE_URL||!cfg.SUPABASE_KEY){
    if(cfg.SUPABASE_URL||cfg.SUPABASE_KEY){mode='cloud';lastErr='ملف config.js ناقص: تأكد من وجود SUPABASE_URL و SUPABASE_KEY.';render();return}
    mode='local';loadLocal();render();return;
  }
  mode='cloud';
  if(!window.supabase||!window.supabase.createClient){lastErr='تعذّر تحميل مكتبة Supabase. تحقق من الاتصال أو من حظر cdn.jsdelivr.net.';render();return}
  step='الاتصال بقاعدة البيانات';render();
  try{sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY)}catch(e){lastErr='createClient: '+((e&&e.message)||e);render();return}
  step='فحص الجلسة';render();
  var r;
  try{
    r=await Promise.race([sb.auth.getSession(),new Promise(function(_,rej){setTimeout(function(){rej(new Error('انتهت مهلة فحص الجلسة'))},8000)})]);
  }catch(e){lastErr=(e&&e.message)||String(e);render();return}
  if(r&&r.data&&r.data.session){step='تحميل البيانات';render();startCloud()}
  else{step='بانتظار تسجيل الدخول';showLogin()}
}
boot();
})();
