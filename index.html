<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نظام تخليص الحاويات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky harbor-teal header with tabs; content in a centered column; tables and a bar chart carry the data. */
:root{
  --bg:#F2F5FF; --surface:#FFFFFF; --surface-2:#EAF0FF; --ink:#0F1B3D; --muted:#55648A; --line:#D6DFF7;
  --brand:#2563EB; --brand-soft:#DCE8FF; --on-brand:#FFFFFF;
  --head-bg:#2A2FA8; --head-bg2:#6D28D9; --head-ink:#FFFFFF; --hl:#FFC21A;
  --good:#0E9F5C; --good-soft:#D5F5E5; --warn:#B45309; --warn-soft:#FFE9BF; --bad:#E0322B; --bad-soft:#FFDAD6;
  --s-rev:#2563EB; --s-cost:#FF8A00;
  --l0:#2563EB; --l1:#F97316; --l2:#10B981; --l3:#EC4899; --l4:#8B5CF6; --l5:#06B6D4; --l6:#EF4444; --l7:#84CC16;
  --f-head:'Cairo','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Cairo',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
  direction:rtl;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1230; --surface:#151B42; --surface-2:#1D2558; --ink:#EEF1FF; --muted:#9FAEDB; --line:#2B3680;
    --brand:#6EA0FF; --brand-soft:#1F2F6E; --on-brand:#071340;
    --head-bg:#1B2080; --head-bg2:#5B21B6; --head-ink:#FFFFFF;
    --good:#3DDC97; --good-soft:#0F3B2A; --warn:#FFB84D; --warn-soft:#4A3510; --bad:#FF7A70; --bad-soft:#4D1B1A;
    --s-rev:#6EA0FF; --s-cost:#FFA133;
    --l0:#6EA0FF; --l1:#FF9A4D; --l2:#3DDC97; --l3:#FF7EC0; --l4:#B79BFF; --l5:#4DD8F0; --l6:#FF7A70; --l7:#A8E04A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1230; --surface:#151B42; --surface-2:#1D2558; --ink:#EEF1FF; --muted:#9FAEDB; --line:#2B3680;
  --brand:#6EA0FF; --brand-soft:#1F2F6E; --on-brand:#071340;
  --head-bg:#1B2080; --head-bg2:#5B21B6; --head-ink:#FFFFFF;
  --good:#3DDC97; --good-soft:#0F3B2A; --warn:#FFB84D; --warn-soft:#4A3510; --bad:#FF7A70; --bad-soft:#4D1B1A;
  --s-rev:#6EA0FF; --s-cost:#FFA133;
  --l0:#6EA0FF; --l1:#FF9A4D; --l2:#3DDC97; --l3:#FF7EC0; --l4:#B79BFF; --l5:#4DD8F0; --l6:#FF7A70; --l7:#A8E04A; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0;direction:rtl;padding:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head-bg);z-index:60}
h1,h2,h3{font-family:var(--f-head);margin:0;line-height:1.3;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--head-bg);background-image:linear-gradient(90deg,var(--head-bg),var(--head-bg2));color:var(--head-ink)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{flex:none;width:38px;height:26px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--hl) 0 3px,transparent 3px 6px),var(--hl);opacity:.95;position:relative;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.mark::after{content:"";position:absolute;inset:3px 0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 2px,transparent 2px 6px)}
.co{font-family:var(--f-head);font-weight:800;font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.sub{font-size:12px;opacity:.75}
.sync{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.12);white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-top:2px}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:inherit;opacity:.72;padding:8px 14px;cursor:pointer;font-family:var(--f-head);font-weight:600;font-size:15px;white-space:nowrap}
.tab:hover{opacity:1}
.tab[aria-selected="true"]{opacity:1;border-bottom-color:var(--hl)}

main{padding-top:20px;padding-bottom:max(40px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grow{flex:1 1 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px 0}
.panel-h h2{font-size:17px}
.panel-b{padding:14px 16px 16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;display:inline-block}
.pos{color:var(--good)} .neg{color:var(--bad)}
.mono{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate;display:inline-block;letter-spacing:.02em}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger[data-armed]{background:var(--bad);color:var(--surface)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.icon-btn{width:36px;height:36px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1}
.in{width:100%;min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
textarea.in{min-height:72px;resize:vertical}
.in.ltr{direction:ltr;text-align:right}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.grid.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.toolbar{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)) auto;gap:10px;padding:14px 16px;align-items:end}
@media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--f-head);font-weight:800;font-size:27px;line-height:1.25;overflow-wrap:anywhere}
.kpi .v .cur{font-size:14px;font-weight:600;color:var(--muted)}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.main{background:var(--brand-soft);border-color:transparent}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:880px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.02em}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr[data-act]{cursor:pointer}
tbody tr[data-act]:hover{background:var(--brand-soft)}
tbody tr:nth-child(even){background:var(--surface-2)}
tbody tr[style] td:first-child{box-shadow:inset -5px 0 0 var(--lc)}
.cid{display:flex;align-items:center;gap:10px}
.cico{flex:none;width:34px;height:22px;border-radius:3px;background:var(--lc,var(--l7));position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.cico::after{content:"";position:absolute;inset:3px 0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,transparent 2px 5px)}
.cid b{font-weight:600}
tfoot td{font-weight:700;background:var(--surface-2);border-bottom:0}
td.n,th.n{text-align:left}
.cell-sub{font-size:12px;color:var(--muted)}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.mute{background:var(--surface-2);color:var(--muted)}
.demo-tag{font-size:11px;margin-inline-start:6px;padding:0 6px;border-radius:4px;background:var(--surface-2);color:var(--muted);border:1px dashed var(--line);font-weight:500}

/* dashboard */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.watch{list-style:none;margin:0;padding:0}
.watch li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.watch li:last-child{border-bottom:0}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px}
.chart-box{overflow-x:auto}
.chart-box svg{display:block;min-width:660px;width:100%;height:auto}
.chart-box text{font-family:var(--f-body);font-size:12px;fill:var(--muted)}
.empty{padding:36px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h2{font-size:19px}
.empty p{margin:0;max-width:46ch;color:var(--muted)}

/* modal */
.overlay{position:fixed;inset:0;z-index:70;background:rgba(5,15,20,.55);overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));padding-top:max(16px,env(safe-area-inset-top,0px))}
.modal{background:var(--surface);color:var(--ink);border-radius:12px;max-width:880px;margin:0 auto;border:1px solid var(--line)}
.modal.sm{max-width:520px}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.m-head h2{font-size:18px}
.m-body{padding:6px 18px 16px;display:flex;flex-direction:column;gap:18px}
.fs{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.fs>h3{font-size:14px;color:var(--brand);letter-spacing:.02em}
.live{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:14px}
.m-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 12px 12px;padding:12px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sum{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.sum b{font-family:var(--f-head);font-size:16px}
.err{color:var(--bad);font-size:13.5px;min-height:1em}
.toast{position:fixed;z-index:90;inset-inline:0;bottom:max(20px,env(safe-area-inset-bottom,0px));margin:0 auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}}}

/* v2 additions */
.kpi.unsold{cursor:pointer;border-style:dashed}
.kpi.unsold:hover{background:var(--brand-soft)}
.kpi.unsold .v{color:var(--warn)}
.hdr-r{justify-content:flex-end;min-width:0}
@media(max-width:600px){.who{max-width:100%;flex-basis:100%;text-align:right}}
.top .btn{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.4)}
.top .btn:hover{background:rgba(255,255,255,.28)}
.chip.info{background:var(--brand-soft);color:var(--brand)}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:8px}
.tab[hidden]{display:none}
.gs{position:relative;flex:1 1 240px;max-width:420px;min-width:170px}
.gs[hidden]{display:none}
.gs input{width:100%;min-height:36px;padding:4px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff}
.gs input::placeholder{color:rgba(255,255,255,.75)}
.gs input:focus{background:var(--surface);color:var(--ink);outline:2px solid var(--hl)}
.gs input:focus::placeholder{color:var(--muted)}
.gres{position:absolute;inset-inline:0;top:calc(100% + 6px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.28);max-height:60vh;overflow-y:auto;z-index:80}
.gres h4{margin:0;padding:8px 12px 4px;font-size:12px;color:var(--muted);font-weight:600}
.gres button{display:flex;width:100%;text-align:right;gap:10px;align-items:center;justify-content:space-between;background:none;border:0;padding:8px 12px;cursor:pointer;color:inherit}
.gres button:hover,.gres button:focus-visible{background:var(--brand-soft)}
.who{font-size:12px;opacity:.9;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.stg{display:flex;gap:3px;margin-top:5px;width:88px}
.stg i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.stg i.on{background:var(--brand)}
.stg.done i.on{background:var(--good)}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pipe button{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--pc,var(--brand));border-radius:10px;padding:10px 14px;text-align:right;cursor:pointer;display:flex;flex-direction:column;gap:0}
.pipe button:hover{background:var(--brand-soft)}
.pipe b{font-family:var(--f-head);font-size:26px;line-height:1.2}
.alerts{display:flex;flex-direction:column;gap:10px}
.alert{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;border:1px solid transparent;font-size:14px}
.alert.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.alert.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.alert.ok{background:var(--good-soft);color:var(--good)}
.alert .t{font-weight:700;font-size:15px}
.alert .chips{display:flex;gap:6px;flex-wrap:wrap}
.alert .chips button{border:1px solid currentColor;background:var(--surface);color:inherit;border-radius:999px;padding:2px 12px;cursor:pointer;font-size:12.5px}
.sbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line)}
.sbar i{display:block;height:100%}
.slg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.slg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px}
.hb{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;padding:4px 0;font-size:13.5px}
.hb .bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.hb .bar i{display:block;height:100%;border-radius:5px}
.sheet-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:10px}
.sheet-head h1{font-size:22px}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tot>div{background:var(--surface-2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column}
.tot>div.due{background:var(--brand-soft)}
.tot b{font-family:var(--f-head);font-size:19px}
.att{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;flex-wrap:wrap}
.watch li[data-act]:hover{background:var(--brand-soft)}
@media print{
  :root{--bg:#fff;--surface:#fff;--surface-2:#f2f2f2;--ink:#000;--muted:#444;--line:#bbb;--brand-soft:#eee}
  body{background:#fff;color:#000;font-size:12px}
  body::before{display:none}
  .top,.no-print,.toast{display:none!important}
  main{padding:0}
  body.pm #app{display:none!important}
  .overlay{position:static;background:none;padding:0;overflow:visible}
  .modal{border:0;max-width:none;border-radius:0}
  .m-body{padding:0}
  .panel{border:0}
  .tw{overflow:visible}
  table{min-width:0!important}
  tr{break-inside:avoid}
  tbody tr:nth-child(even){background:none}
  .sheet *{color:#000!important}
  .sheet .pos,.sheet .neg{font-weight:700}
}
</style>

(function(){
'use strict';
window.addEventListener('error',function(ev){lastErr=(ev.message||'خطأ')+(ev.lineno?' (سطر '+ev.lineno+')':'');try{render()}catch(x){}});
window.addEventListener('unhandledrejection',function(ev){var r=ev.reason;lastErr=(r&&(r.message||r.code))||String(r);try{render()}catch(x){}});
document.documentElement.lang='ar';document.documentElement.dir='rtl';

/* ---------- calculation ---------- */
function calc(c){
  var s=S(),arr=ymd(c.arrival),pk=ymd(c.pickup);
  var end=pk!=null?pk:ymd(todayStr());
  var days=arr==null?0:Math.max(0,Math.round((end-arr)/DAY));
  var free=has(c.freeOv)?n(c.freeOv):n(s.freeDays[c.size]);
  var rate=has(c.rateOv)?n(c.rateOv):n(s.rate[c.size]);
  var delayDays=Math.max(0,days-free);
  var delayCost=delayDays*rate;
  var items=0;COST_KEYS.forEach(function(k){items+=n(c.costs&&c.costs[k])});
  var cost=items+delayCost,rev=n(c.revenue);
  return {days:days,free:free,rate:rate,left:free-days,delayDays:delayDays,delayCost:delayCost,items:items,cost:cost,rev:rev,profit:rev-cost,open:pk==null}
}
function agg(list){
  var a={count:0,open:0,rev:0,cost:0,profit:0,delay:0,items:0};
  list.forEach(function(c){var k=calc(c);a.count++;if(k.open)a.open++;a.rev+=k.rev;a.cost+=k.cost;a.profit+=k.profit;a.delay+=k.delayCost;a.items+=k.items});
  return a;
}
function statusOf(c){if(c.pickup)return 'delivered';return (c.status==='customs'||c.status==='ready')?c.status:'arrived'}
function mFin(mid){
  var sale=0,paid=0,first='',lastPay='';
  state.containers.forEach(function(c){if(c.merchantId===mid){sale+=calc(c).rev;var d=calDate(c);if(d&&(!first||d<first))first=d}});
  state.payments.forEach(function(p){if(p.merchantId===mid){paid+=n(p.amount);if(p.date&&p.date>lastPay)lastPay=p.date}});
  return {sale:sale,paid:paid,bal:sale-paid,first:first,lastPay:lastPay};
}
function totalDue(){return sum(state.containers,function(c){return calc(c).rev})-sum(state.payments,function(p){return n(p.amount)})}

/* ---------- audit ---------- */
var DIFF={
  containers:[['merchantId','التاجر',function(v){return v?mName(v):''}],['number','رقم الحاوية'],['size','الحجم'],['line','الخط'],['berth','الرصيف'],['arrival','تاريخ الرسو'],['pickup','تاريخ الاستلام'],['status','المرحلة',function(v){return STAGE_L[v||'arrived']}],['revenue','البيع',function(v){return v?fmt(v):''}],['freeOv','أيام السماح'],['rateOv','الغرامة اليومية'],['notes','ملاحظات']],
  merchants:[['name','الاسم'],['phone','الهاتف'],['notes','ملاحظات']],
  payments:[['amount','المبلغ',function(v){return fmt(v)}],['date','التاريخ'],['method','الطريقة'],['note','ملاحظة']]
};
function dv(v){return v==null||v===''?'—':String(v)}
function diff(kind,a,b){
  var out=[];if(!a)return out;
  (DIFF[kind]||[]).forEach(function(f){
    var x=a[f[0]],y=b[f[0]];if(f[2]){x=f[2](x);y=f[2](y)}
    if(String(x==null?'':x)!==String(y==null?'':y))out.push(f[1]+': '+dv(x)+' ← '+dv(y));
  });
  if(kind==='containers')COST_KEYS.forEach(function(k){var x=n(a.costs&&a.costs[k]),y=n(b.costs&&b.costs[k]);if(x!==y)out.push(S().labels[k]+': '+fmt(x)+' ← '+fmt(y))});
  return out;
}
function labelOf(kind,r){
  if(kind==='containers')return r.number||'';
  if(kind==='merchants'||kind==='staff')return r.name||'';
  if(kind==='payments')return mName(r.merchantId)+' — '+fmt(r.amount);
  if(kind==='attachments')return r.name||'';
  return 'إعدادات النظام';
}
function audit(action,kind,rec,old){
  if(mode!=='cloud'||!sb)return;
  var ch=[];
  if(action==='update'){ch=kind==='config'?['تم تحديث الإعدادات']:diff(kind,old,rec);if(!ch.length)return}
  var at=new Date().toISOString();
  var body={at:at,by:me.email,action:action,kind:kind,label:labelOf(kind,rec),ch:ch.slice(0,14)};
  sb.from('records').insert({kind:'audit',id:uid(),body:body,updated_at:at}).then(function(r){if(r&&r.error)console.warn(r.error.message)});
}

/* ---------- storage ---------- */
function loadLocal(){
  try{
    var r=JSON.parse(localStorage.getItem('lg_container_v1')||'null');
    if(r){state.merchants=r.merchants||[];state.containers=r.containers||[];state.payments=r.payments||[];state.saved=r.saved||{}}
  }catch(e){}
  loaded={m:true,c:true,s:true};
}
function persistLocal(){try{localStorage.setItem('lg_container_v1',JSON.stringify({merchants:state.merchants,containers:state.containers,payments:state.payments,saved:state.saved}))}catch(e){}}
function clean(o){return JSON.parse(JSON.stringify(o))}
function put(kind,obj,nolog){
  var id=obj.id,body=clean(obj);delete body.id;
  var old=(state[kind]||[]).find(function(x){return x.id===id})||null;
  var p;
  if(mode==='cloud')p=sbPut(kind,id,body);
  else{
    var arr=state[kind],i=arr.findIndex(function(x){return x.id===id}),rec=Object.assign({id:id},body);
    if(i>=0)arr[i]=rec;else arr.push(rec);
    persistLocal();render();p=Promise.resolve();
  }
  return p.then(function(){if(!nolog)audit(old?'update':'create',kind,Object.assign({id:id},body),old)});
}
function del(kind,id,nolog){
  var old=(state[kind]||[]).find(function(x){return x.id===id})||null;
  var p;
  if(mode==='cloud')p=sbDel(kind,id);
  else{state[kind]=state[kind].filter(function(x){return x.id!==id});persistLocal();render();p=Promise.resolve()}
  return p.then(function(){if(!nolog&&old)audit('delete',kind,old,null)});
}
function putSettings(obj){
  var old=state.saved;
  if(mode==='cloud')return sbSettings(clean(obj)).then(function(){audit('update','config',obj,old)});
  state.saved=clean(obj);persistLocal();render();return Promise.resolve();
}
function fail(e){
  var m=e&&(e.code==='invalid_argument'||e.code==='42501')?'لا تملك صلاحية تنفيذ هذا الإجراء.':e&&e.code==='quota_exceeded'?'امتلأت سعة التخزين.':'تعذّر الحفظ. حاول مرة أخرى.';
  toast(m);
}
function fetchPage(off,acc){
  return sb.from('records').select('kind,id,body').neq('kind','audit').order('kind').order('id').range(off,off+999).then(function(r){
    if(r.error)throw r.error;
    acc=acc.concat(r.data);
    return r.data.length===1000?fetchPage(off+1000,acc):acc;
  });
}
function loadAll(){
  if(!sb)return Promise.resolve();
  return fetchPage(0,[]).then(function(rows){
    var m=[],c=[],p=[],a=[],cfg={};
    rows.forEach(function(x){
      var o=Object.assign({id:x.id},x.body);
      if(x.kind==='merchants')m.push(o);
      else if(x.kind==='containers')c.push(o);
      else if(x.kind==='payments')p.push(o);
      else if(x.kind==='attachments')a.push(o);
      else if(x.kind==='config'&&x.id==='main')cfg=x.body||{};
    });
    state.merchants=m;state.containers=c;state.payments=p;state.attachments=a;state.saved=cfg;loaded={m:true,c:true,s:true};fault=false;lastSync=new Date();render();
  }).catch(function(e){fault=true;lastErr=(e&&(e.message||e.code))||String(e);render()});
}

function loadStaff(){

function applyLocal(kind,id,body){
  var arr=state[kind],i=arr.findIndex(function(x){return x.id===id}),rec=Object.assign({id:id},body);
  if(i>=0)arr[i]=rec;else arr.push(rec);render();
}
function sbPut(kind,id,body){
  return sb.from('records').upsert({kind:kind,id:id,body:body,updated_at:new Date().toISOString()}).then(function(r){
    if(r.error)throw r.error;applyLocal(kind,id,body);
  });
}
function sbDel(kind,id){
  return sb.from('records').delete().eq('kind',kind).eq('id',id).select().then(function(r){
    if(r.error)throw r.error;
    if(!r.data||!r.data.length)throw {code:'42501'};
    state[kind]=state[kind].filter(function(x){return x.id!==id});render();
  });
}
function sbSettings(obj){
  return sb.from('records').upsert({kind:'config',id:'main',body:obj,updated_at:new Date().toISOString()}).then(function(r){
    if(r.error)throw r.error;state.saved=obj;render();
  });
}
function startCloud(){
  loadAll().then(function(){if(P().admin)loadStaff()});
  var t;
  sb.channel('records-live').on('postgres_changes',{event:'*',schema:'public',table:'records'},function(){clearTimeout(t);t=setTimeout(function(){loadAll();if(ui.tab==='log')loadAudit()},300)}).subscribe();
  setInterval(function(){if(!document.hidden&&!document.getElementById('cf')&&!document.getElementById('mf')&&!document.getElementById('pf'))loadAll()},15000);
  var back=function(){if(!document.hidden&&ready()&&!document.getElementById('cf')&&!document.getElementById('mf')&&!document.getElementById('pf')){loadAll();if(ui.tab==='log')loadAudit()}};
  document.addEventListener('visibilitychange',back);window.addEventListener('focus',back);window.addEventListener('online',back);
  setTimeout(function(){if(!ready()){slow=true;render()}},10000);
}

function niceTop(max){

function chart(){

  });

  var mx=0;by.forEach(function(d){mx=Math.max(mx,d.rev,d.cost)});
  var top=niceTop(mx||1),stp=iw/12,bw=Math.min(18,stp*.3);

  for(var i=0;i<=5;i++){

    if(d.cost>0)s+='<rect x="'+(cx+1)+'" y="'+(pt+ih-hc)+'" width="'+bw+'" height="'+hc+'" rx="2" fill="var(--s-cost)"><title>'+MONTHS[i]+' '+yr+' — الكلفة: '+fmt(d.cost,0)+'</title></rect>';
    s+='<text x="'+cx+'" y="'+(H-26)+'" text-anchor="middle"><tspan x="'+cx+'" dy="0">'+nm[0]+'</tspan>'+(nm[1]?'<tspan x="'+cx+'" dy="13">'+nm.slice(1).join(' ')+'</tspan>':'')+'</text>';
  });
  return s+'</svg>';
}

/* ---------- views: reports ---------- */
function inPeriod(d){
  if(!d||d.slice(0,4)!==String(ui.ry))return false;
  return ui.rm==='all'||+d.slice(5,7)===+ui.rm;
}
function repData(){
  var list=state.containers.filter(function(c){return inPeriod(calDate(c))});
  var pays=state.payments.filter(function(p){return inPeriod(p.date)});
  var by={};
  list.forEach(function(c){var k=calc(c),m=by[c.merchantId]=by[c.merchantId]||{id:c.merchantId,n:0,rev:0,cost:0,profit:0,paid:0};m.n++;m.rev+=k.rev;m.cost+=k.cost;m.profit+=k.profit});
  pays.forEach(function(p){var m=by[p.merchantId]=by[p.merchantId]||{id:p.merchantId,n:0,rev:0,cost:0,profit:0,paid:0};m.paid+=n(p.amount)});
  var rows=Object.keys(by).map(function(k){var m=by[k];m.due=mFin(m.id).bal;return m}).sort(function(a,b){return b.rev-a.rev});
  var months=[];
  if(ui.rm==='all'){
    for(var i=0;i<12;i++)months.push({i:i,n:0,rev:0,cost:0,profit:0});
    list.forEach(function(c){var k=calc(c),m=months[+calDate(c).slice(5,7)-1];m.n++;m.rev+=k.rev;m.cost+=k.cost;m.profit+=k.profit});
  }
  return {list:list,pays:pays,rows:rows,months:months,a:agg(list),paid:sum(pays,function(p){return n(p.amount)})};
}

  if(!q){box.hidden=true;box.innerHTML='';return}
  var cs=state.containers.filter(function(c){return String(c.number||'').toLowerCase().indexOf(q)>=0||String(c.line||'').toLowerCase().indexOf(q)>=0||mName(c.merchantId).toLowerCase().indexOf(q)>=0}).slice(0,7);
  var ms=state.merchants.filter(function(m){return m.name.toLowerCase().indexOf(q)>=0||String(m.phone||'').indexOf(q)>=0}).slice(0,5);
  var h='';
  if(cs.length)h+='<h4>الحاويات</h4>'+cs.map(function(c){return '<button type="button" data-act="gs-container" data-id="'+esc(c.id)+'"><span class="cid">'+cico(c)+'<span><span class="mono"><b>'+esc(c.number)+'</b></span><span class="cell-sub" style="display:block">'+esc(mName(c.merchantId))+'</span></span></span><span class="chip '+STAGE_C[statusOf(c)]+'">'+STAGE_L[statusOf(c)]+'</span></button>'}).join('');
  if(ms.length)h+='<h4>التجار</h4>'+ms.map(function(m){return '<button type="button" data-act="gs-merchant" data-id="'+esc(m.id)+'"><b>'+esc(m.name)+'</b><span class="cell-sub">'+esc(m.phone||'')+'</span></button>'}).join('');
  if(!h)h='<h4>لا توجد نتائج</h4>';
  box.innerHTML=h;box.hidden=false;
}
function gsClose(){var i=$('#gs'),b=$('#gres');if(i)i.value='';if(b){b.hidden=true;b.innerHTML=''}}

/* ---------- actions ---------- */
var armT;
var ACT={
  tab:function(el){ui.tab=el.dataset.id;render();window.scrollTo(0,0);if(mode==='cloud'){if(ui.tab==='log')loadAudit();if(ui.tab==='set')loadStaff()}},
  'add-container':function(){openContainer(null)},
  'edit-container':function(el){openContainer(el.dataset.id)},
  'add-merchant':function(){openMerchant(null)},
  'edit-merchant':function(el){openMerchant(el.dataset.id)},
  'add-payment':function(el){openPayment(el.dataset.id)},
  'pay-cancel':function(){if(ui.stm)renderStatement();else closeModal()},
  statement:function(el){openStatement(el.dataset.id)},
  'st-copy':function(){var d=stmtData();if(d)copyText(stmtText(d))},
  'del-pay':function(el){confirmDel(el,function(){del('payments',el.dataset.id).then(function(){toast('تم حذف الدفعة');renderStatement()}).catch(fail)})},
  print:function(){window.print()},
  'goto-stage':function(el){ui.st=el.dataset.id;ui.fm='';ui.q='';ui.fs='all';ui.tab='cont';render();window.scrollTo(0,0)},
  'goto-unsold':function(){ui.fs='unsold';ui.st='all';ui.fm='';ui.q='';ui.tab='cont';render();window.scrollTo(0,0)},
  'gs-container':function(el){gsClose();openContainer(el.dataset.id)},
  'gs-merchant':function(el){gsClose();if(P().money)openStatement(el.dataset.id);else{ui.tab='merch';render()}},
  'report-csv':reportCsv,
  'log-refresh':function(){loadAudit().then(function(){toast('تم التحديث')})},
  close:closeModal,
  ovl:closeModal,
  'clear-filters':function(){ui.q='';ui.fm='';ui.fs='all';ui.st='all';render()},
  'apply-margin':function(){
    var m=n($('#cf-margin').value),k=calc(readForm());
    $('#cf-rev').value=Math.round(k.cost*(1+m/100));live();
  },
  'del-container':function(el){confirmDel(el,function(){
    var id=el.dataset.id,atts=state.attachments.filter(function(a){return a.containerId===id});
    var p=Promise.resolve();
    if(sb&&atts.length)p=sb.storage.from('docs').remove(atts.map(function(a){return a.path})).then(function(){return Promise.all(atts.map(function(a){return del('attachments',a.id,true)}))});
    p.then(function(){return del('containers',id)}).then(function(){closeModal();toast('تم حذف الحاوية')}).catch(fail);
  })},
  'del-merchant':function(el){
    if(state.containers.some(function(c){return c.merchantId===el.dataset.id})){$('#mf-err').textContent='لا يمكن حذف تاجر لديه حاويات. احذف حاوياته أو انقلها أولاً.';return}
    confirmDel(el,function(){del('merchants',el.dataset.id).then(function(){closeModal();toast('تم حذف التاجر')}).catch(fail)});
  },
  'att-upload':function(){
    var id=$('#cf').dataset.id,inp=$('#att-file'),f=inp&&inp.files[0];
    if(!f){toast('اختر ملفاً أولاً');return}
    if(f.size>8*1024*1024){toast('حجم الملف أكبر من 8 ميغابايت');return}
    var ext=(f.name.match(/\.[A-Za-z0-9]{1,6}$/)||[''])[0].toLowerCase();
    var path=id+'/'+uid()+ext,type=$('#att-type').value;
    toast('جارٍ رفع الملف…');
    sb.storage.from('docs').upload(path,f,{contentType:f.type||'application/octet-stream'}).then(function(r){
      if(r.error)throw r.error;
      return put('attachments',{id:uid(),containerId:id,type:type,name:f.name,path:path,size:f.size,mime:f.type,at:new Date().toISOString(),by:me.email});
    }).then(function(){toast('تم رفع الملف');renderAtt(id)}).catch(function(e){toast('تعذّر رفع الملف'+(e&&e.message?': '+e.message:''))});
  },
  'att-open':function(el){
    var a=state.attachments.find(function(x){return x.id===el.dataset.id});if(!a)return;
    var w=window.open('','_blank');
    if(!w){toast('اسمح بالنوافذ المنبثقة لعرض الملف');return}
    sb.storage.from('docs').createSignedUrl(a.path,300).then(function(r){
      if(r.error||!r.data){w.close();toast('تعذّر فتح الملف');return}
      w.location.href=r.data.signedUrl;
    });
  },
  'att-del':function(el){confirmDel(el,function(){
    var a=state.attachments.find(function(x){return x.id===el.dataset.id});if(!a)return;
    sb.storage.from('docs').remove([a.path]).then(function(){return del('attachments',a.id)}).then(function(){toast('تم حذف المرفق');renderAtt(a.containerId)}).catch(fail);
  })},
  'save-settings':function(){
    var g=function(i){return document.getElementById(i).value},o={company:g('s-company').trim(),currency:g('s-cur').trim()||'د.ع',freeDays:{},rate:{},labels:{},alertDays:n(g('s-alert')),dueDays:Math.max(1,n(g('s-due')))};
    SIZES.forEach(function(z){o.freeDays[z]=n(g('s-free-'+z));o.rate[z]=n(g('s-rate-'+z))});
    COST_KEYS.forEach(function(k){o.labels[k]=g('s-lab-'+k).trim()||DEF_LABELS[k]});
    putSettings(o).then(function(){toast('تم حفظ الإعدادات')}).catch(fail);
  },
  'load-demo':loadDemo,
  'remove-demo':removeDemo,
  'export':exportCsv,
  refresh:function(){loadAll().then(function(){toast('تم تحديث البيانات')})},
  retry:function(){location.reload()},
  logout:function(){if(sb)sb.auth.signOut().then(function(){location.reload()})}
};
function confirmDel(el,fn){
  if(el.hasAttribute('data-armed')){fn();return}
  el.setAttribute('data-armed','1');el.textContent='اضغط مرة أخرى للتأكيد';
  clearTimeout(armT);armT=setTimeout(function(){el.removeAttribute('data-armed');el.textContent='حذف'},4000);
}
document.addEventListener('click',function(e){
  if(!e.target.closest('.gs')){var b=$('#gres');if(b&&!b.hidden)b.hidden=true}
  var el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='ovl'&&e.target!==el)return;
  var f=ACT[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('keydown',function(e){
  var tg=e.target,typing=tg&&tg.matches&&tg.matches('input,select,textarea');
  if(e.key==='Escape'){gsClose();if($('#modal-root').firstChild&&!$('#lf'))closeModal()}
  if(e.key==='/'&&!typing&&$('#gs')&&!$('#gsbox').hidden){e.preventDefault();$('#gs').focus()}
  if(e.key==='Enter'&&tg&&tg.id==='gs'){e.preventDefault();var b=$('#gres button');if(b)b.click()}
  if((e.key==='Enter'||e.key===' ')&&tg&&tg.matches&&tg.matches('tr[data-act]')){e.preventDefault();ACT[tg.dataset.act](tg)}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='gs')gsRun();
  else if(t.dataset&&t.dataset.f&&t.id==='f-q'){ui.q=t.value;listCont()}
  else if(t.closest&&t.closest('#cf'))live();
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='pf-merchant'){payBal();return}
  if(!t.dataset||!t.dataset.f)return;
  var f=t.dataset.f;
  if(f==='month'){ui.month=t.value;render()}
  if(f==='year'){ui.year=+t.value;render()}
  if(f==='ry'){ui.ry=+t.value;render()}
  if(f==='rm'){ui.rm=t.value;render()}
  if(f==='fm'){ui.fm=t.value;listCont()}
  if(f==='fs'){ui.fs=t.value;listCont()}
  if(f==='st'){ui.st=t.value;listCont()}
  if(f==='lk'){ui.lk=t.value;render()}
  if(f==='lq'){ui.lq=t.value;render()}
  if(f==='stfrom'&&ui.stm){ui.stm.from=t.value;renderStatement()}
  if(f==='stto'&&ui.stm){ui.stm.to=t.value;renderStatement()}
  if(f==='staffrole'){
    var uid2=t.dataset.id,u=state.staff.find(function(x){return x.user_id===uid2}),nv=t.value;if(!u)return;
    var oldRole=u.role;
    sb.from('staff').update({role:nv}).eq('user_id',uid2).select().then(function(r){
      if(r.error||!r.data||!r.data.length){toast('تعذّر تغيير الصلاحية');t.value=oldRole;return}
      u.role=nv;toast('تم تغيير الصلاحية');
      audit('update','staff',{name:u.name},null);
      var at=new Date().toISOString();
      sb.from('records').insert({kind:'audit',id:uid(),body:{at:at,by:me.email,action:'update',kind:'staff',label:u.name,ch:['الصلاحية: '+ROLES[oldRole]+' ← '+ROLES[nv]]},updated_at:at});
    });
  }
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='cf')saveContainer();
  if(e.target.id==='mf')saveMerchant();
  if(e.target.id==='pf')savePayment();
  if(e.target.id==='lf'){
    var em=$('#lf-email').value.trim(),pw=$('#lf-pass').value;
    $('#lf-err').textContent='';
    sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){
      if(r.error||!r.data||!r.data.session){$('#lf-err').textContent='البريد الإلكتروني أو كلمة المرور غير صحيحة.';return}
      closeModal();enter(r.data.session);
    });
  }
});

/* ---------- boot ---------- */
async function boot(){
  render();
  var cfg=window.APP_CONFIG||{};
  step='قراءة الإعدادات';render();
  if(!cfg.SUPABASE_URL||!cfg.SUPABASE_KEY){
    if(cfg.SUPABASE_URL||cfg.SUPABASE_KEY){mode='cloud';lastErr='ملف config.js ناقص: تأكد من وجود SUPABASE_URL و SUPABASE_KEY.';render();return}
    mode='local';me.role='admin';localWhy=!window.APP_CONFIG?'ملف config.js لم يُحمَّل في هذا الجهاز (غير موجود أو نسخة قديمة في الذاكرة).':'ملف config.js موجود لكن قيمتَي SUPABASE_URL و SUPABASE_KEY فارغتان.';loadLocal();render();return;
  }
  mode='cloud';
  if(!window.supabase||!window.supabase.createClient){lastErr='تعذّر تحميل مكتبة Supabase. تحقق من الاتصال أو من حظر cdn.jsdelivr.net.';render();return}
  step='الاتصال بقاعدة البيانات';render();
  try{sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY)}catch(e){lastErr='createClient: '+((e&&e.message)||e);render();return}
  step='فحص الجلسة';render();
  var r;
  try{
    r=await Promise.race([sb.auth.getSession(),new Promise(function(_,rej){setTimeout(function(){rej(new Error('انتهت مهلة فحص الجلسة'))},8000)})]);
  }catch(e){lastErr=(e&&e.message)||String(e);render();return}
  if(r&&r.data&&r.data.session){enter(r.data.session)}
  else{step='بانتظار تسجيل الدخول';showLogin()}
}
boot();
})();
</script>
